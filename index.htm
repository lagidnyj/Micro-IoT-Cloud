<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Micro IoT Cloud</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --gemini: #7c3aed;
      --copilot: #238636;
      --accent: #58a6ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: clamp(2rem, 5vw, 3.5rem);
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    /* Велика SVG Хмаринка */
    .cloud-icon {
      width: clamp(100px, 25vw, 160px);
      height: auto;
      margin-bottom: 1.5rem;
      filter: drop-shadow(0 0 25px rgba(88, 166, 255, 0.25));
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #fff 30%, #8b949e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: clamp(1rem, 3vw, 1.25rem);
      color: var(--text-muted);
      margin-bottom: 2.5rem;
      font-weight: 400;
    }

    /* Секція Авторів */
    .authors-section {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.75rem 1.25rem;
      margin-bottom: 2rem;
    }

    .authors-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 1.25rem;
    }

    .authors-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }

    .author-card {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 1rem;
      background: #21262d;
      border: 1px solid var(--border);
      border-radius: 12px;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 1.1rem;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .author-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .author-card svg {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }

    /* Гумористична примітка */
    .humor-note {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-muted);
      background: rgba(235, 87, 87, 0.08);
      border: 1px dashed rgba(235, 87, 87, 0.3);
      padding: 1rem 1.25rem;
      border-radius: 12px;
    }

    .humor-note strong {
      color: #ff7b72;
    }

    @media (max-width: 480px) {
      .container { padding: 1.5rem 1rem; }
      .authors-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Велика красива хмаринка -->
    <svg class="cloud-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M46 24.08C44.96 15.04 37.28 8 28 8 20.32 8 13.84 12.8 11.28 19.6 4.88 20.48 0 25.92 0 32.5 0 39.84 5.92 45.76 13.26 45.76H45.5C51.3 45.76 56 41.06 56 35.26 56 29.74 51.72 25.18 46 24.08Z" fill="url(#cloud-grad)"/>
      <defs>
        <linearGradient id="cloud-grad" x1="0" y1="8" x2="56" y2="45.76" gradientUnits="userSpaceOnUse">
          <stop stop-color="#58A6FF"/>
          <stop offset="1" stop-color="#7C3AED"/>
        </linearGradient>
      </defs>
    </svg>

    <h1>Micro IoT Cloud</h1>
    <p class="subtitle">Приватне сховище стану пристроїв</p>

    <!-- Секція Авторів -->
    <div class="authors-section">
      <div class="authors-title">⚡ Спроектовано та розроблено штучним інтелектом ⚡</div>
      
      <div class="authors-grid">
        <!-- Gemini -->
        <a href="https://gemini.google.com" target="_blank" rel="noopener" class="author-card">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 0C12 6.627 6.627 12 0 12C6.627 12 12 17.373 12 24C12 17.373 17.373 12 24 12C17.373 12 12 6.627 12 0Z" fill="#A855F7"/>
          </svg>
          <span>Google Gemini</span>
        </a>

        <!-- GitHub Copilot -->
        <a href="https://github.com/features/copilot" target="_blank" rel="noopener" class="author-card">
          <svg viewBox="0 0 24 24" fill="currentColor" style="color: #f0f6fc;">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          <span>GitHub Copilot</span>
        </a>
      </div>
    </div>

    <!-- Текстовий дисклеймер з гумором -->
    <div class="humor-note">
      💡 <strong>Увага:</strong> Цей сервер написаний повністю нейромережами. Власник сервера в PHP взагалі <i>ні бум-бум</i>, тому ламати тут нічого — за безпеку відповідають Google та Microsoft! 😉
    </div>

  </div>

</body>
</html>
